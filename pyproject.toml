[project]
name = "science-agent-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "PyJWT[crypto]>=2.9",
    "cryptography>=42",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.20",
    "aiohttp>=3.10",
    "pyte>=0.8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/science_agent_backend"]
